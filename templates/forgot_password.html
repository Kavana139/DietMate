<!-- forgot_password.html -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — DietMate</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>(function(){ var t=localStorage.getItem('dm_theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();</script>
<style>
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg);}
.auth-box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border-ui);border-radius:var(--r-2xl);padding:44px 40px;box-shadow:var(--sh-lg);animation:fadeUp 0.4s var(--spring) both;}
.auth-logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-sec);text-decoration:none;font-weight:600;margin-bottom:24px;}
.back-link:hover{color:var(--text);}
</style>
</head>
<body class="auth-page">
<div class="auth-box">
  <div class="auth-logo">DietMate</div>
  <a href="/" class="back-link">&#8592; Back to Sign In</a>
  <h2 style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px;">Forgot your password?</h2>
  <p style="font-size:13.5px;color:var(--text-sec);margin-bottom:24px;line-height:1.65;">No worries. Enter your registered email and we will send you a secure reset link.</p>

  {% if message %}
  <div style="background:var(--accent-mute);border:1px solid var(--border-h);border-radius:var(--r-md);padding:14px 16px;margin-bottom:20px;font-size:13.5px;color:var(--accent);font-weight:600;">
    {{ message }}
  </div>
  {% endif %}
  {% if error %}
  <div class="error-box" style="margin-bottom:16px;">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group" style="margin-bottom:22px;">
      <label class="form-label">Email address</label>
      <input type="email" name="email" class="form-input" placeholder="you@email.com" required autocomplete="email">
    </div>
    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Send Reset Link</button>
  </form>

  <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-mute);">Remember your password? <a href="/" style="color:var(--accent);font-weight:700;text-decoration:none;">Sign In</a></p>
</div>
</body>
</html>
